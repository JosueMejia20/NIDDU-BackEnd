name: Verificar sintaxis SQL

on:
  push:
    branches:
      - database
    paths:
      - "**.sql"
  workflow_dispatch:

jobs:
  check-syntax:
    name: Validar sintaxis de BD_Niddu.sql
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.2
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Esperar a que MySQL esté disponible
        shell: bash
        run: |
          echo "Esperando a que MySQL inicie..."
          i=0
          until mysqladmin ping -h 127.0.0.1 -proot --silent; do
            i=$((i+1))
            if [ $i -ge 15 ]; then
              echo "MySQL no respondió a tiempo."
              exit 1
            fi
            echo "Intento $i/15: esperando..."
            sleep 4
          done
          echo "MySQL está listo."

      - name: Verificar sintaxis SQL
        shell: bash
        run: |
          echo "Verificando sintaxis de BD_Niddu.sql..."
          mysql -h 127.0.0.1 -uroot -proot --execute="source BD_Niddu.sql"
          echo "Verificacion completada correctamente."
