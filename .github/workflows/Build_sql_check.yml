name: Verificar sintaxis SQL

on:
  push:
    branches:
      - database
    paths:
      - "**.sql"
  workflow_dispatch:

jobs:
  check-syntax:
    name: Validar sintaxis de BD_Niddu.sql
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.2
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Esperar a que MySQL esté disponible
        shell: bash
        run: |
          echo "Esperando a que MySQL inicie..."
          for i in {1..15}; do
            if mysqladmin ping -h 127.0.0.1 -proot --silent; then
              echo "MySQL está listo."
              break
            fi
            echo "Intento $i/15: esperando..."
            sleep 4
          done

      - name: Verificar sintaxis SQL
        shell: bash
        run: |
          echo "Verificando sintaxis de BD_Niddu.sql..."
          mysql -h 127.0.0.1 -uroot -proot --execute="source BD_Niddu.sql"
          echo "Verificación completada correctamente."
